name: Audit and test

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Restore pinned shared template before the combined test suite
        run: scripts/bootstrap_template.sh
      - run: python -m pytest -q
      - run: python scripts/build_site.py
