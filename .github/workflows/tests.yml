name: Audit and test

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Restore only the pinned shared code (not large data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python -c 'from prepare_data import restore_template; restore_template(True)'
      - run: python -m pytest -q
      - run: python scripts/build_site.py
