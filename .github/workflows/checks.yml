name: Verify audit and dashboard
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the immutable shared template and research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/bootstrap_template.sh
          python scripts/restore_audit_inputs.py
      - name: Reproduce registry audit and rendered comparison
        run: |
          python scripts/run_preflight.py
          python scripts/build_focus_table.py
          git diff --exit-code -- executive-summary.html
      - name: Test fail-closed gates and public feed
        run: |
          python -m pytest -q
          PYTHONPATH=.cache/template/src python -m pytest -q \
            .cache/template/tests/test_evaluate_holdout.py \
            .cache/template/tests/test_evaluate_holdout_shared.py \
            .cache/template/tests/test_submission_format.py \
            .cache/template/tests/test_uniqueness.py \
            .cache/template/tests/test_literal_gate_witness.py
