name: Evidence and site checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore shared template and pinned public mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_template.py
          python scripts/fetch_inputs.py
      - name: Recheck saved bytes and shared tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_portfolio.py
          python scripts/audit_current_candidates.py
          python scripts/verify_shared_tools.py
          python scripts/build_site.py
      - name: Automated tests
        run: python -m pytest -q
      - name: Check site JavaScript
        run: node --check docs/assets/app.js
