name: Audit and site checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/build_site.py
      - name: Probe public leaderboard snapshot (no authentication)
        run: python scripts/refresh_leaderboard.py --output /tmp/leaderboard.json
