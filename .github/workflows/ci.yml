name: Evidence and site checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore pinned shared templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_template.py
          PYTHONPATH=scripts python -c 'from prepare_data import restore_template; restore_template(True)'
      - name: Restore pinned public mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/fetch_inputs.py > /tmp/gems-inputs.out 2> /tmp/gems-inputs.err
          status=$?
          cat /tmp/gems-inputs.out /tmp/gems-inputs.err
          if [ "$status" -ne 0 ]; then
            echo "::error title=Input restore failed::$(tr '\n' ' ' < /tmp/gems-inputs.err | tail -c 2000)"
            exit "$status"
          fi
      - name: Recheck saved bytes and shared tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_nine_sites.py
          python scripts/audit_current_candidates.py
          python scripts/verify_shared_tools.py
          python scripts/build_research_site.py
      - name: Automated tests
        run: python -m pytest -q
      - name: Check site JavaScript
        run: node --check docs/deep-review/assets/app.js
